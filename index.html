<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>justwasm experiments</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f172a;
        color: #e2e8f0;
      }

      main {
        width: min(100% - 3rem, 48rem);
      }

      h1 {
        margin-bottom: 0.5rem;
        font-size: clamp(2.5rem, 4vw, 4rem);
      }

      p {
        margin-top: 0;
        line-height: 1.6;
        color: #cbd5e1;
      }

      ul {
        list-style: none;
        padding: 0;
        margin: 2rem 0 0;
        display: grid;
        gap: 1rem;
      }

      a {
        display: block;
        padding: 1.25rem 1.5rem;
        border-radius: 1rem;
        background: rgba(15, 23, 42, 0.55);
        color: inherit;
        text-decoration: none;
        border: 1px solid rgba(148, 163, 184, 0.3);
      }

      a:hover,
      a:focus-visible {
        border-color: #38bdf8;
        transform: translateY(-2px);
      }

      strong {
        display: block;
        margin-bottom: 0.25rem;
        font-size: 1.1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Wasm experiments</h1>
      <p>Explore small experiments built with WebAssembly.</p>
      <ul>
        <li>
          <a href="/crush/">
            <strong>Crush</strong>
            A WebAssembly experiment available at /crush/.
          </a>
        </li>
        <li>
          <a href="/hackpad/">
            <strong>Hackpad</strong>
            A WebAssembly experiment available at /hackpad/.
          </a>
        </li>
      </ul>
    </main>
  </body>
</html>
